<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>International Students Form</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg, #1b5e20, #66bb6a);
    }

    .form-container{
        width:420px;
        background:white;
        padding:30px;
        border-radius:15px;
        box-shadow:0 8px 20px rgba(0,0,0,0.2);
    }

    .form-container h1{
        text-align:center;
        color:#1b5e20;
        margin-bottom:25px;
    }

    .input-group{
        margin-bottom:18px;
    }

    .input-group label{
        display:block;
        margin-bottom:6px;
        font-weight:bold;
        color:#2e7d32;
    }

    .input-group input{
        width:100%;
        padding:12px;
        border:2px solid #a5d6a7;
        border-radius:8px;
        outline:none;
        transition:0.3s;
    }

    .input-group input:focus{
        border-color:#2e7d32;
        box-shadow:0 0 5px rgba(46,125,50,0.5);
    }

    button{
        width:100%;
        padding:12px;
        background:#2e7d32;
        color:white;
        border:none;
        border-radius:8px;
        font-size:16px;
        font-weight:bold;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#1b5e20;
    }

    .message{
        text-align:center;
        margin-top:15px;
        color:#1b5e20;
        font-weight:bold;
    }
</style>
</head>

<body>

<div class="form-container">
    <h1>International Students</h1>

    <form id="internationalForm">

        <div class="input-group">
            <label>Name :</label>
            <input type="text" required>
        </div>

        <div class="input-group">
            <label>Age :</label>
            <input type="number" required>
        </div>

        <div class="input-group">
            <label>Country :</label>
            <input type="text" required>
        </div>

        <div class="input-group">
            <label>Previous School :</label>
            <input type="text" required>
        </div>

        <div class="input-group">
            <label>Year :</label>
            <input type="text" required>
        </div>

        <div class="input-group">
            <label>Course :</label>
            <input type="text" required>
        </div>

        <button type="submit">SUBMIT</button>

        <div class="message" id="message"></div>

    </form>
</div>

<script>
    const form = document.getElementById("internationalForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event){
        event.preventDefault();

        message.textContent = "Form Submitted Successfully!";

        form.reset();
    });
</script>

</body>
</html>
